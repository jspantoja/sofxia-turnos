<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — SOFXIA</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>SOFXIA</h1>
      <p>Ingresa con tus credenciales para continuar.</p>

      <form id="form-login">
        <div class="campo">
          <label for="input-email">Correo electrónico</label>
          <input type="email" id="input-email" required autofocus />
        </div>
        <div class="campo">
          <label for="input-password">Contraseña</label>
          <input type="password" id="input-password" required />
        </div>

        <div id="mensaje-error" class="mensaje-error" role="alert" hidden></div>

        <button type="submit" id="btn-login" class="btn-login">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- type="module" es OBLIGATORIO: es lo que le permite a este script
       usar import/export, igual que en Node -->
  <script type="module">
    import { initLoginForm } from './controllers/authController.js';
    initLoginForm();
  </script>
</body>
</html>
